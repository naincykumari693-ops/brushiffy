<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styleB.css">
    <title>Brushify</title>
</head>
<body>
    <center>
        <h1>Brushify</h1>
        <br><br><br><br>
        <div id="editor" contenteditable="true"></div>
        <br><br><br>
        <div id="parent">
            <div id="child">
                <h1>Backgroundcolor</h1>
                <br><br>
                <button class="bg" onclick="bgc('red')"  style="background-color:red;"></button>
                <button class="bg" onclick="bgc('blue')" style="background-color:blue ;" ></button>
                 <button class="bg" onclick="bgc('orange')" style="background-color:orange;" ></button>
                 <button class="bg" onclick="bgc('pink')" style="background-color:pink;" ></button>
                 <button class="bg" onclick="bgc('green')" style="background-color:green;" ></button>
             </div>
              <div id="child">
                <h1>Textcolor</h1>
                <br><br>
                <button class="bg" onclick="Textcolor('red')" style="background-color: red; "></button>
                <button class="bg" onclick="Textcolor('blue')" style="background-color:blue; border: 1px solid black;"></button>
                <button class="bg" onclick="Textcolor('orange')" style="background-color:orange;"></button>
                <button class="bg" onclick="Textcolor('pink')" style="background-color:pink;"></button>
                <button class="bg" onclick="Textcolor('green')" style="background-color: green;"></button>
            </div>
              <div id="child">
                <h1>FontStyle</h1>
                <br><br>
                <button class="fnt" onclick="font('sans-serif')" >Hii</button>
                <button class="fnt" onclick="font('serif')"      >Hii</button>
                <button class="fnt" onclick="font('monospace')"  >Hii</button>
                <button class="fnt" onclick="font('cursive')"    >Hii</button>
                <button class="fnt" onclick="font('fantasy')">Hii</button>
            </div>
        </div>
    </center>

    <script>
        function bgc(color){
            document.getElementById('editor').style.backgroundColor = color
        }
         function Textcolor(color){
            document.getElementById('editor').style.color = color
        }
         function font(font){
            document.getElementById('editor').style.fontFamily = font
        }
    </script>
    
</body>
</html>
